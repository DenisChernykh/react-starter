name: Stage image

on:
  pull_request:
    branches: [stage]
  push:
    branches: [stage]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.15.1"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  publish:
    needs: gate
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Verify locked toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.15.1"
      - run: pnpm install --frozen-lockfile
      - id: metadata
        name: Derive immutable image metadata
        run: |
          IMAGE_NAME="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          COMMIT_TIME="$(git show -s --format=%cI "${GITHUB_SHA}")"
          IMAGE_TAG="sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          WORKFLOW_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          {
            echo "image_name=${IMAGE_NAME}"
            echo "commit_time=${COMMIT_TIME}"
            echo "image_tag=${IMAGE_TAG}"
            echo "workflow_run_url=${WORKFLOW_RUN_URL}"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.image_name }}:${{ steps.metadata.outputs.image_tag }}
          build-args: |
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ steps.metadata.outputs.commit_time }}
            BUILD_WORKFLOW_RUN_URL=${{ steps.metadata.outputs.workflow_run_url }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.metadata.outputs.image_name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Pull published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
        run: docker pull "${IMAGE_NAME}@${DIGEST}"
      - name: Smoke published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
          WORKFLOW_RUN_URL: ${{ steps.metadata.outputs.workflow_run_url }}
        run: |
          pnpm oci:check \
            --image "${IMAGE_NAME}@${DIGEST}" \
            --revision "${GITHUB_SHA}" \
            --source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --workflow-run-url "${WORKFLOW_RUN_URL}"
      - name: Summarize verified candidate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GATE_RESULT: ${{ needs.gate.result }}
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
          WORKFLOW_RUN_URL: ${{ steps.metadata.outputs.workflow_run_url }}
        run: |
          {
            echo "## Stage image candidate"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Digest: \`${IMAGE_NAME}@${DIGEST}\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Attempt: ${WORKFLOW_RUN_URL}"
            echo "- Gate result: \`${GATE_RESULT}\`"
            echo "- Scan: \`HIGH,CRITICAL\` with unfixed vulnerabilities ignored"
            echo "- Smoke: \`pnpm oci:check\` ran against the published digest"
          } >> "${GITHUB_STEP_SUMMARY}"
